<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">PrepCircle product concept</title>
  <desc id="desc">A conceptual three-step flow showing partner discovery, a reciprocal interview session, and structured feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1728"/><stop offset="1" stop-color="#17264A"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5EEAD4"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="960" height="420" rx="28" fill="url(#bg)"/>
  <path d="M0 330C170 280 280 385 470 320S760 255 960 322" fill="none" stroke="#38BDF8" stroke-opacity=".12" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="54" y="58" fill="#E2E8F0" font-size="16" font-weight="700" letter-spacing="3">PREPCIRCLE · PRODUCT CONCEPT</text>
    <text x="54" y="94" fill="#94A3B8" font-size="16">Practice together. Grow through feedback.</text>

    <g filter="url(#shadow)">
      <rect x="54" y="140" width="238" height="190" rx="18" fill="#10263D" stroke="#2B5775"/>
      <rect x="361" y="140" width="238" height="190" rx="18" fill="#132D48" stroke="#3977A1"/>
      <rect x="668" y="140" width="238" height="190" rx="18" fill="#1D2850" stroke="#6667B8"/>
    </g>

    <g>
      <circle cx="92" cy="183" r="17" fill="#164E63" stroke="#5EEAD4" stroke-width="2"/>
      <path d="M82 211c2-13 18-13 20 0" fill="none" stroke="#99F6E4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="120" cy="183" r="17" fill="#263B70" stroke="#818CF8" stroke-width="2"/>
      <path d="M110 211c2-13 18-13 20 0" fill="none" stroke="#C7D2FE" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="254" fill="#F8FAFC" font-size="19" font-weight="700">Find a partner</text>
      <text x="78" y="282" fill="#A9BED2" font-size="14">Discover peers with</text>
      <text x="78" y="303" fill="#A9BED2" font-size="14">complementary goals</text>
    </g>

    <g>
      <circle cx="422" cy="187" r="24" fill="#123F55" stroke="#5EEAD4" stroke-width="2"/>
      <circle cx="538" cy="187" r="24" fill="#29376D" stroke="#818CF8" stroke-width="2"/>
      <path d="M455 177h50l-10-9m10 9-10 9M505 198h-50l10-9m-10 9 10 9" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="385" y="254" fill="#F8FAFC" font-size="19" font-weight="700">Practice together</text>
      <text x="385" y="282" fill="#A9BED2" font-size="14">Take turns as interviewer</text>
      <text x="385" y="303" fill="#A9BED2" font-size="14">and candidate</text>
    </g>

    <g>
      <rect x="704" y="166" width="166" height="72" rx="10" fill="#121F3B" stroke="#6366B8"/>
      <path d="M722 189h130M722 207h92M722 225h112" stroke="#A5B4FC" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <text x="692" y="270" fill="#F8FAFC" font-size="19" font-weight="700">Exchange feedback</text>
      <text x="692" y="298" fill="#A9BED2" font-size="14">Reflect and improve</text>
    </g>

    <path d="M303 234h46m-10-8 10 8-10 8M610 234h46m-10-8 10 8-10 8" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="386" fill="#7F9AB5" font-size="12" letter-spacing="1.3">CONCEPTUAL FLOW · NOT A SCREENSHOT OF THE PRODUCT</text>
  </g>
</svg>